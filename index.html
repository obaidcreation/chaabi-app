/* ===== Deal Room, services, AI expert ===== */
.svtile{display:grid;gap:6px;text-align:start;cursor:pointer;color:var(--ink);font:inherit}
.svtile .ico{color:var(--brass);width:26px;height:26px}
.svtile:hover{box-shadow:var(--shadow)}
.dealhd{display:grid;gap:14px}
.dcode{font:700 26px/1.1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em;color:var(--brand)}
.dgrid{display:grid;gap:16px}
@media(min-width:960px){.dgrid{grid-template-columns:1.4fr 1fr;align-items:start}}
.dgrid>*{min-width:0;display:grid;gap:16px;align-content:start}
.panel{display:grid;gap:12px}
.panel h3{margin:0;font:700 20px/1.2 var(--display);display:flex;gap:8px;align-items:center}
.panel h3 .n{width:28px;height:28px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font:700 13px var(--sans)}
.panel h3 .n.done{background:var(--ok);color:#fff}
.panel.locked{opacity:.55}
.parties{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.party{background:var(--tint);border-radius:12px;padding:12px}
.badges3{display:flex;gap:8px;flex-wrap:wrap}
.sigline{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.plans{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.plan .price{font-size:28px}
.plan.hl{border:2px solid var(--brand)}
.plist{list-style:none;padding:0;margin:0;display:grid;gap:6px;font-size:14px}
.plist li{display:flex;gap:8px;align-items:center}
.plist .ico{width:18px;height:18px;color:var(--ok)}
.hcrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.hcrow .seg button{padding:5px 10px;font-size:13px}
.expcta{margin-top:28px;background:var(--brand-deep);color:#F3ECDD;border-radius:20px;padding:24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.expcta h3{margin:0 0 4px;font:700 24px/1.15 var(--display);color:#F3ECDD}
.expcta p{margin:0;color:#C9D6D2;max-width:56ch}
.exp{max-width:860px;margin:0 auto;display:grid;gap:14px}
.exphd{display:flex;gap:14px;align-items:center}
.chat{display:grid;gap:12px;min-height:200px;align-content:start}
.msg{display:grid;gap:6px;max-width:88%;padding:12px 14px;border-radius:16px;font-size:15px}
.msg.user{justify-self:end;background:var(--brand);color:var(--on-brand);border-end-end-radius:4px}
.msg.assistant{justify-self:start;background:var(--card);border:1px solid var(--line);border-end-start-radius:4px}
.msg .mtxt{white-space:pre-wrap;overflow-wrap:anywhere}
.msg .mimgs{display:flex;gap:6px;flex-wrap:wrap}
.msg .mimgs img{width:84px;height:64px;object-fit:cover;border-radius:8px}
.msg .say{justify-self:start;border:0;background:var(--tint);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.msg .say .ico{width:14px;height:14px}
.aibar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;display:grid;gap:8px;box-shadow:var(--shadow)}
@media(min-width:860px){.aibar{bottom:16px}}
.aibar textarea{min-height:56px;border:0;background:transparent;padding:6px}
.aibar textarea:focus{box-shadow:none}
.aithumbs{display:flex;gap:8px;flex-wrap:wrap}
.aithumbs:empty{display:none}
.aithumbs span{position:relative}
.aithumbs img{width:72px;height:56px;object-fit:cover;border-radius:10px;display:block}
.aithumbs button{position:absolute;top:-6px;inset-inline-end:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);cursor:pointer;font-size:12px}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
/* printable documents */
.docwrap{background:var(--tint);padding:16px;border-radius:16px;overflow:auto;max-height:70vh}
.docv{background:#fff;color:#111;max-width:760px;margin:0 auto;padding:36px 40px;font:15px/1.65 Georgia,"Times New Roman",serif;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.docv header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:2px solid #0F5A55;padding-bottom:12px;margin-bottom:18px;flex-wrap:wrap}
.docv .dlogo{font:700 24px/1 var(--sans);color:#0F5A55}
.docv .dlogo span{color:#B8862F}
.docv h2{font:700 20px/1.3 var(--sans);margin:0;text-align:end}
.docv h4{font:700 14px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:#0F5A55;margin:18px 0 6px}
.docv p{margin:0 0 10px}
.docv table{width:100%;border-collapse:collapse;font-size:14px}
.docv td{border:1px solid #ddd;padding:6px 8px;vertical-align:top}
.docv .sigs{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:26px;font-size:13px}
.docv .sigs div{border-top:1px solid #111;padding-top:6px}
.docv footer{margin-top:24px;border-top:1px solid #ddd;padding-top:10px;font:12px/1.5 var(--sans);color:#555}
.docv .draft{color:#B5502F;font:700 13px var(--sans);letter-spacing:.1em}
@media print{
  body{padding:0!important;background:#fff!important}
  body>*:not(#xmodal){display:none!important}
  #xmodal{position:static!important;background:none!important;display:block!important}
  #xmodal .modal{max-height:none!important;width:auto!important;padding:0!important;background:#fff!important;overflow:visible!important}
  #xmodal .noprint{display:none!important}
  .docwrap{background:none;padding:0;max-height:none;overflow:visible}
  .docv{box-shadow:none;max-width:none;padding:0}
}

/* Layout: sticky top bar; auth screens split brand panel + form card; app screens on a 1180px column; bottom tab bar on phones */
:root{
  --bg:#F8F3EA;--card:#FFFDF8;--tint:#EFE6D3;--ink:#12302E;--muted:#55665F;--line:#D9CDB4;
  --brand:#0F5A55;--brand-deep:#0B3B38;--on-brand:#fff;--brass:#B8862F;--terra:#B5502F;--ok:#1E7B4A;
  --err:#A8321C;--errbg:#F7E1D9;--okbg:#DCEFE2;--scrim:rgba(8,24,23,.55);
  --shadow:0 1px 2px rgba(18,48,46,.06),0 10px 28px rgba(18,48,46,.08);
  --display:"Fraunces",Georgia,serif;--sans:"Plus Jakarta Sans",system-ui,sans-serif;--urdu:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1F1E;--card:#12302E;--tint:#1A3C39;--ink:#F3ECDD;--muted:#A9B9B4;--line:#2A4A47;--brand:#1F7A72;--brand-deep:#17504B;--brass:#E0B25A;--terra:#E08A66;--ok:#5FC48A;--err:#FF9E85;--errbg:#3A201A;--okbg:#173A28;--scrim:rgba(0,0,0,.6);--shadow:0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1F1E;--card:#12302E;--tint:#1A3C39;--ink:#F3ECDD;--muted:#A9B9B4;--line:#2A4A47;--brand:#1F7A72;--brand-deep:#17504B;--brass:#E0B25A;--terra:#E08A66;--ok:#5FC48A;--err:#FF9E85;--errbg:#3A201A;--okbg:#173A28;--scrim:rgba(0,0,0,.6);--shadow:0 10px 28px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 92px;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body[dir=rtl]{font-family:var(--urdu);line-height:2}
body[dir=rtl] .disp{font-family:var(--urdu);letter-spacing:0;line-height:1.7}
button,select,input,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto}
a{color:var(--brand);font-weight:600}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance}
.disp{font-family:var(--display);letter-spacing:-.015em}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:12px}
.sp{flex:1}
/* bars */
.demo-bar{background:var(--tint);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;margin-top:12px;display:flex;gap:8px;align-items:center}
.demo-bar b{color:var(--terra)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:12px;height:64px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:0}
.logo b{font:700 23px/1 var(--display);letter-spacing:-.01em}
.logo b i{font-style:normal;color:var(--brass)}
.dlinks{display:none;gap:2px;margin-inline-start:20px}
.dlinks button{background:none;border:0;padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted)}
.dlinks button[aria-current=true]{color:var(--ink);background:var(--tint)}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:14px}
.bnav{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.bnav button{flex:1;background:none;border:0;padding:6px 2px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative}
.bnav button[aria-current=true]{color:var(--brand)}
.bnav .plus{background:var(--brand);color:var(--on-brand);border-radius:14px;width:44px;height:32px;display:grid;place-items:center}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.dot{position:absolute;top:2px;inset-inline-end:calc(50% - 16px);width:9px;height:9px;border-radius:50%;background:var(--terra)}
@media(min-width:860px){.dlinks{display:flex}.bnav{display:none!important}body{padding-block:0 0}}
/* buttons + forms */
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;cursor:pointer;background:var(--brand);color:var(--on-brand);min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{background:var(--brand-deep)}
.btn[disabled]{opacity:.6;cursor:progress}
.btn.alt{background:var(--tint);color:var(--ink)}
.btn.alt:hover{background:var(--line)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.brass{background:var(--brass);color:#12302E}
.btn.danger{background:transparent;color:var(--err);border:1px solid var(--line)}
.btn.sm{min-height:38px;padding:8px 14px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
label.f{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;min-height:46px;color:var(--ink)}
.in:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
textarea.in{min-height:110px;resize:vertical}
.frow{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.pw{position:relative}
.pw .in{padding-inline-end:70px}
.pw button{position:absolute;inset-inline-end:6px;top:6px;bottom:6px;border:0;background:var(--tint);border-radius:9px;padding:0 10px;font-size:13px;font-weight:700;cursor:pointer}
.meter{display:flex;gap:4px;margin-top:6px}
.meter i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.meter[data-s="1"] i:nth-child(-n+1){background:var(--terra)}
.meter[data-s="2"] i:nth-child(-n+2){background:var(--brass)}
.meter[data-s="3"] i:nth-child(-n+3){background:var(--ok)}
.meter[data-s="4"] i{background:var(--ok)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink);font-weight:500}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--brand);flex:none}
.alert{border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.alert.err{background:var(--errbg);color:var(--err)}
.alert.ok{background:var(--okbg);color:var(--ok)}
.alert.info{background:var(--tint);color:var(--ink)}
.alert:empty{display:none}
.seg{display:inline-flex;background:var(--tint);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 16px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--brand);color:var(--on-brand)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--tint);color:var(--ink)}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--tint);color:var(--brass)}.tag.bad{background:var(--errbg);color:var(--err)}.tag.brand{background:var(--brand);color:var(--on-brand)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.empty{border:1px dashed var(--line);border-radius:16px;padding:32px 20px;text-align:center;color:var(--muted)}
h2.sec{font:700 28px/1.15 var(--display);margin:40px 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px}
.page{padding-top:24px}
.ph1{font:700 clamp(28px,4vw,40px)/1.1 var(--display);margin:0 0 6px}
/* auth */
.auth{display:grid;gap:0;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));min-height:calc(100vh - 65px)}
@media(min-width:900px){.auth{grid-template-columns:1fr 1fr}}
.brandp{display:none;background:var(--brand-deep);color:#F3ECDD;padding:48px;position:relative;overflow:hidden;border-radius:22px;margin:16px 0}
@media(min-width:900px){.auth{margin-inline:0}}
@media(min-width:900px){.brandp{display:flex;flex-direction:column;justify-content:space-between;gap:24px}}
.brandp h2{font:700 40px/1.08 var(--display);margin:0 0 12px;color:#F3ECDD;max-width:14ch}
.brandp p{max-width:42ch;color:#C9D6D2;margin:0}
.brandp svg{width:100%;max-width:440px;height:auto}
.authf{display:flex;align-items:flex-start;justify-content:center;padding:32px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
@media(min-width:900px){.authf{align-items:center}}
.acard{width:100%;max-width:440px;display:grid;gap:14px}
.acard h1{font:700 32px/1.1 var(--display);margin:0}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.bigico{width:64px;height:64px;border-radius:18px;background:var(--tint);display:grid;place-items:center;color:var(--brand)}
.bigico .ico{width:32px;height:32px}
/* welcome */
.wel{display:grid;gap:32px;padding-block:40px 24px;align-items:center}
@media(min-width:900px){.wel{grid-template-columns:1.1fr .9fr;padding-block:64px 40px}}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brass)}
body[dir=rtl] .eyebrow{letter-spacing:0}
.wel h1{font:700 clamp(38px,6vw,68px)/1 var(--display);letter-spacing:-.025em;margin:10px 0 16px}
.wel .lead{font-size:18px;color:var(--muted);max-width:48ch;margin:0 0 22px}
.points{display:grid;gap:10px;margin:0 0 26px;padding:0;list-style:none}
.points li{display:flex;gap:10px;align-items:center;font-weight:600}
.points .ico{color:var(--ok)}
.mosaic svg{width:100%;height:auto;display:block}
.mb{fill:var(--brand)}.mp{fill:var(--brass)}.mt{fill:var(--terra)}.md{fill:var(--brand-deep)}.mn{fill:var(--tint)}.mr{fill:none;stroke:var(--brass);stroke-width:12}.mk{fill:var(--brass)}
.brandp .mb{fill:var(--brand)}.brandp .md{fill:#0E4A46}
/* hero search */
.hero{display:grid;gap:28px;padding-block:28px 8px;align-items:center}
@media(min-width:900px){.hero{grid-template-columns:1.15fr .85fr;padding-block:48px 16px}}
.hero h1{font:700 clamp(32px,5vw,56px)/1.03 var(--display);letter-spacing:-.02em;margin:0 0 12px}
.hero .lead{color:var(--muted);font-size:17px;max-width:46ch;margin:0 0 20px}
.sbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:grid;gap:12px}
.mosaic.hide-sm{display:none}
@media(min-width:900px){.mosaic.hide-sm{display:block}}
/* cards */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.lc{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:start;transition:box-shadow .15s,transform .15s;min-width:0}
.lc:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.ph{aspect-ratio:16/10;max-width:100%;position:relative;display:flex;align-items:flex-end;padding:12px;color:var(--on-brand);background:var(--brand);overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.t1{background:var(--brand-deep)}.ph.t2{background:var(--terra)}.ph.t3{background:var(--ok)}
.ph .ty{position:relative;font:700 22px/1 var(--display)}
body[dir=rtl] .ph .ty{font-family:var(--urdu);line-height:1.6}
.ph .badges{position:absolute;top:10px;inset-inline-start:10px;display:flex;gap:6px}
.ph .badges span{background:rgba(0,0,0,.5);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:6px}
.heart{position:absolute;top:8px;inset-inline-end:8px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.94);color:#12302E;cursor:pointer;display:grid;place-items:center}
.heart .ico{width:19px;height:19px;stroke-width:2}
.heart[aria-pressed=true] .ico{fill:#B5502F;stroke:#B5502F}
.lb{padding:14px;display:grid;gap:6px}
.price{font:700 22px/1.1 var(--display)}
.price small{font:500 13px var(--sans);color:var(--muted)}
.meta{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.meta .ico{width:14px;height:14px;vertical-align:-2px;color:var(--terra)}
.box b .ico{width:18px;height:18px;vertical-align:-3px;color:var(--terra)}
.ttl{font-weight:700;overflow-wrap:anywhere}
.asal{background:var(--tint);border-radius:10px;padding:8px 10px;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.asal b{font-variant-numeric:tabular-nums}
.vb{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ok)}
.vb.l0{color:var(--muted)}
.pips{display:inline-flex;gap:3px}
.pips i{width:14px;height:6px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--ok)}
.skel{background:var(--card);border:1px solid var(--line);border-radius:16px;height:300px;position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--tint),transparent);animation:sh 1.2s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.why{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.why .box b{display:block;margin-bottom:6px}
.cta{margin-top:40px;background:var(--brand);color:var(--on-brand);border-radius:20px;padding:28px;display:flex;gap:20px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.cta h3{font:700 26px/1.15 var(--display);margin:0 0 6px}
.cta p{margin:0;opacity:.9;max-width:52ch}

.ld{display:grid;gap:24px}
@media(min-width:960px){.ld{grid-template-columns:1.5fr 1fr;align-items:start}}
.ld>*{min-width:0}
.gal{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:18px;overflow:hidden;background:var(--brand);display:grid;place-items:center;color:var(--on-brand)}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gbtn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#12302E;font-size:22px;cursor:pointer}
.gbtn.prev{inset-inline-start:12px}.gbtn.next{inset-inline-end:12px}
.gcount{position:absolute;bottom:12px;inset-inline-end:12px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;font-weight:700;padding:4px 10px;border-radius:8px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-block:10px}
.th{flex:none;width:84px;height:60px;border-radius:10px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:var(--tint)}
.th.on{border-color:var(--brass)}
.th img{width:100%;height:100%;object-fit:cover}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
table.kv{width:100%;border-collapse:collapse;margin:8px 0}
table.kv td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.kv td:last-child{text-align:end;font-weight:700;font-variant-numeric:tabular-nums}

.owner{display:flex;gap:12px;align-items:center}
.av{width:44px;height:44px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:700;flex:none}

.drop .ico{width:40px;height:40px;color:var(--brand)}
.phgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-top:16px}
.phi{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:12px;overflow:hidden;background:var(--tint);cursor:grab;border:2px solid transparent}

.phi img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.phi .pn{position:absolute;top:6px;inset-inline-start:6px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px}
.phi .cov{position:absolute;top:6px;inset-inline-end:6px;background:var(--brass);color:#12302E;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px}
.phi .lowq{position:absolute;bottom:40px;inset-inline-start:6px;background:var(--terra);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px}
.pbar{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;gap:2px;padding:4px;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.pbar button{flex:1;border:0;border-radius:7px;background:rgba(255,255,255,.92);color:#12302E;height:30px;cursor:pointer;font-weight:700}
.prog{height:10px;background:var(--tint);border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand);transition:width .2s}
.qm{display:grid;gap:8px}
.qm li{display:flex;gap:8px;align-items:center;font-size:14px}
.qm ul{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.qm .ico{width:18px;height:18px}
.qm .y{color:var(--ok)}.qm .n{color:var(--muted)}
/* inbox */
.ic{display:grid;gap:8px}
.ic .hd{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mail{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;display:grid;gap:6px}
.mail .from{font-size:12px;color:var(--muted)}
.mail pre{white-space:pre-wrap;font:inherit;font-size:14px;margin:0;color:var(--ink);overflow-wrap:anywhere}
/* account */
.acct{display:grid;gap:20px}
@media(min-width:900px){.acct{grid-template-columns:1fr 1.3fr;align-items:start}}
.links{display:grid;gap:8px}
.links button{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;cursor:pointer;font-weight:600}
.ml{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.ml .thumb{width:96px;height:72px;border-radius:10px;overflow:hidden;background:var(--brand)}
.ml .thumb img{width:100%;height:100%;object-fit:cover}
.ml>div{min-width:0}
/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding:0 max(0px,env(safe-area-inset-right,0px)) 0 max(0px,env(safe-area-inset-left,0px))}
@media(min-width:760px){.ov{align-items:center}}
.modal{background:var(--bg);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:24px 22px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media(min-width:760px){.modal{border-radius:22px}}
.modal h2{font:700 30px/1.1 var(--display);margin:0}
.toast{position:fixed;inset-inline:0;bottom:calc(92px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;z-index:60;font-weight:600;font-size:14px}
@media(min-width:860px){.toast{bottom:24px}}
.foot{margin-top:56px;padding-block:24px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
/* maps */
.map{height:340px;border-radius:16px;overflow:hidden;border:1px solid var(--line);position:relative;z-index:0;isolation:isolate;background:var(--tint);direction:ltr}
.map.tall{height:min(70vh,640px)}
.mapnote{position:absolute;inset:auto 10px 10px 10px;z-index:900;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.lyr{display:flex;background:var(--card);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.lyr button{border:0;background:none;padding:8px 12px;font:700 13px var(--sans);cursor:pointer;color:var(--ink)}
.lyr button[aria-pressed=true]{background:var(--brand);color:var(--on-brand)}
.ppin{display:inline-block;transform:translate(-50%,-100%);background:var(--brand);color:#fff;font:700 12px/1 var(--sans);padding:6px 9px;border-radius:999px;white-space:nowrap;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.cpin{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:#B8862F;color:#12302E;font:700 14px/1 var(--sans);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.leaflet-cluster-anim .leaflet-marker-icon,.leaflet-cluster-anim .leaflet-marker-shadow{transition:transform .3s ease-out,opacity .3s ease-in}
.kpin{width:30px;height:30px;border-radius:50% 50% 50% 0;background:#B5502F;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.maptools{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:900;box-shadow:var(--shadow)}
.geo-res{display:grid;gap:6px;max-height:230px;overflow:auto}
.geo-res:empty{display:none}
.geo-res button{display:flex;gap:8px;align-items:flex-start;text-align:start;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 10px;cursor:pointer;font-size:14px;color:var(--ink)}
.geo-res .ico{width:18px;height:18px;color:var(--terra);margin-top:2px}
.near{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.near .box{padding:12px;display:grid;gap:4px}
.near i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px}
.leaflet-container{font-family:var(--sans)}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

 if(/invalid login/i.test(m))k="errLogin";else if(/not confirmed/i.test(m))k="errNotConfirmed";else if(/already (been )?registered|already exists/i.test(m))k="errExists";else if(/rate limit|security purposes|too many/i.test(m))k="errRate";else if(/password should|weak/i.test(m))k="errPwWeak";else if(/failed to fetch|network/i.test(m))k="errNet";
 const x=new Error(k?t(k):m);if(k==="errNotConfirmed")x.code="not_confirmed";return x}
const KL=k=>t("k_"+k);
function proofSubject(i,ev){return `Chaabi.com · ${ev==="created"?t("pf_new"):t("st_"+ev)} · ${KL(i.kind)} · ${i.ref_code}`}
function proofText(i,l,ev){return [`${t("pf_ref")}: ${i.ref_code}`,`${t("pf_listing")}: ${l.title||""} (${l.area||""}, ${l.city||""})`,`${t("pf_kind")}: ${KL(i.kind)}`,i.amount?`${t("pf_amount")}: ${money(i.amount,l.currency)}`:"",i.visit_at?`${t("pf_visit")}: ${fmtDate(i.visit_at)}`:"",i.message?`"${i.message}"`:"",`${t("pf_status")}: ${t("st_"+(ev==="created"?"open":ev))}`,`${t("pf_time")}: ${fmtDate(new Date())}`,"",t("pf_keep")].filter(x=>x!==false&&x!==null).join("\n")}
const blobToData=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});

 };

/* ---------------- LIVE backend (Supabase) ---------------- */
function makeLive(){
 const sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 const B="listing-photos",home=location.origin+location.pathname;
 const pub=p=>sb.storage.from(B).getPublicUrl(p).data.publicUrl;
 const chk=r=>{if(r.error)throw mapErr(r.error);return r.data};
 const SEL="*, listing_photos(path,position)";
 const norm=l=>Object.assign({},l,{photos:(l.listing_photos||[]).slice().sort((a,b)=>a.position-b.position).map(p=>pub(p.path))});
 const toS=s=>s?{user:{id:s.user.id,email:s.user.email,verified:!!s.user.email_confirmed_at}}:null;
 async function uidNow(){const {data}=await sb.auth.getSession();if(!data.session)throw new Error(t("errAuth"));return data.session.user.id}
 return {
  auth:{
   async session(){const {data}=await sb.auth.getSession();return toS(data.session)},
   onChange(cb){sb.auth.onAuthStateChange((ev,s)=>setTimeout(()=>cb(ev,toS(s)),0))},
   async signUp(p){const d=chk(await sb.auth.signUp({email:p.email,password:p.password,options:{emailRedirectTo:home,data:{full_name:p.full_name,phone:p.phone,role:p.role,city:p.city}}}));
    if(d.user&&Array.isArray(d.user.identities)&&d.user.identities.length===0)throw new Error(t("errExists"));return {needsVerify:!d.session}},
   async resend(email){chk(await sb.auth.resend({type:"signup",email,options:{emailRedirectTo:home}}))},
   async signIn(email,pw){return toS(chk(await sb.auth.signInWithPassword({email,password:pw})).session)},
   async signOut(){await sb.auth.signOut()},
   async forgot(email){chk(await sb.auth.resetPasswordForEmail(email,{redirectTo:home}))},
   async updatePassword(pw){chk(await sb.auth.updateUser({password:pw}))},
   async google(){chk(await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:home}}))}
  },
  profile:{
   async get(){const d=chk(await sb.rpc("my_profile"));const r=(Array.isArray(d)?d[0]:d)||{};const {data}=await sb.auth.getUser();return Object.assign({},r,{email:data.user&&data.user.email})},
   async update(p){const id=await uidNow();chk(await sb.from("profiles").update(p).eq("id",id))}
  },
  listings:{
   async search(f){let q=sb.from("listings").select(SEL).eq("status","active");
    if(f.mode)q=q.eq("mode",f.mode);if(f.city)q=q.ilike("city",f.city.replace(/[%_,()]/g,""));if(f.country)q=q.eq("country",f.country);
    if(f.bbox)q=q.gte("lat",f.bbox[0]).lte("lat",f.bbox[2]).gte("lng",f.bbox[1]).lte("lng",f.bbox[3]);if(f.type)q=q.eq("type",f.type);if(f.max)q=q.lte("price",f.max);if(f.lvl)q=q.gte("verification_level",f.lvl);if(f.low)q=q.lte("advance_months",1);
    const s=(f.q||"").replace(/[^\p{L}\p{N} -]/gu,"").trim().slice(0,40);if(s)q=q.or(`area.ilike.%${s}%,title.ilike.%${s}%,society_name.ilike.%${s}%`);
    q=f.sort==="low"?q.order("price",{ascending:true}):f.sort==="high"?q.order("price",{ascending:false}):q.order("created_at",{ascending:false});
    return chk(await q.limit(f.limit||60)).map(norm)},
   async get(id){const l=norm(chk(await sb.from("listings").select(SEL).eq("id",id).maybeSingle())||(()=>{throw new Error(t("errGone"))})());
    const {data:o}=await sb.from("profiles").select("full_name,role,cnic_verified").eq("id",l.owner_id).maybeSingle();return Object.assign(l,{owner_name:o&&o.full_name,owner_role:o&&o.role,owner_cnic:o&&o.cnic_verified})},
   async mine(){const id=await uidNow();return chk(await sb.from("listings").select(SEL).eq("owner_id",id).order("created_at",{ascending:false})).map(norm)},
   async byIds(ids){if(!ids.length)return [];return chk(await sb.from("listings").select(SEL).in("id",ids).eq("status","active")).map(norm)},
   async create(d){return chk(await sb.from("listings").insert(d).select("id").single()).id},
   async setStatus(id,status){chk(await sb.from("listings").update({status}).eq("id",id))},
   async addPhotos(id,blobs,onP){const u=await uidNow(),rows=[];
    for(let i=0;i<blobs.length;i++){const b=blobs[i],ext=b.type==="image/webp"?"webp":"jpg",path=`${u}/${id}/${Date.now()}-${i}.${ext}`;
     chk(await sb.storage.from(B).upload(path,b,{contentType:b.type,cacheControl:"31536000",upsert:false}));rows.push({listing_id:id,path,position:i});onP&&onP(i+1,blobs.length)}
    if(rows.length){chk(await sb.from("listing_photos").insert(rows));chk(await sb.from("listings").update({cover_path:rows[0].path}).eq("id",id))}}
  },
  favs:{
   async list(){const {data}=await sb.auth.getSession();if(!data.session)return [];return chk(await sb.from("favorites").select("listing_id")).map(r=>r.listing_id)},
   async toggle(id,on){const u=await uidNow();if(on)chk(await sb.from("favorites").upsert({user_id:u,listing_id:id}));else chk(await sb.from("favorites").delete().eq("user_id",u).eq("listing_id",id))}
  },
  inq:{
   async create(p){return chk(await sb.from("inquiries").insert(p).select("*").single())},
   async mine(){const d=chk(await sb.from("inquiries").select("*, listing:listings(id,title,area,city,price,mode,type,currency), proof_emails(event,status)").order("created_at",{ascending:false}).limit(100));
    return d.map(i=>Object.assign({},i,{listing:i.listing||{},proofs:(i.proof_emails||[]).filter(p=>p.status==="sent").map(p=>p.event)}))},
   async setStatus(id,status){chk(await sb.from("inquiries").update({status}).eq("id",id))},
   async contact(id){const d=chk(await sb.rpc("inquiry_contact",{p_id:id}));return (Array.isArray(d)?d[0]:d)||null}
  },
  async proof(id,event){const r=await sb.functions.invoke("send-proof-email",{body:{inquiry_id:id,event}});if(r.error)throw new Error(t("errProof"));return r.data},
  admin:{
   async pending(){return chk(await sb.from("listings").select(SEL).eq("status","pending").order("created_at",{ascending:true})).map(norm)},
   async moderate(id,p){chk(await sb.from("listings").update(p).eq("id",id))}
  },
  mailbox(){return null},_sb:sb,_uidNow:uidNow,_norm:norm
 };
}

async function compress(file){

 const w=src.width,h=src.height,sc=Math.min(1,1600/Math.max(w,h)),cw=Math.round(w*sc),ch=Math.round(h*sc);
 const c=document.createElement("canvas");c.width=cw;c.height=ch;c.getContext("2d").drawImage(src,0,0,cw,ch);
 let blob=await new Promise(r=>c.toBlob(r,"image/webp",.82));if(!blob||blob.type!=="image/webp")blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.84));

}

 if(q("[data-newpost]")){S.post=null;return render()}
 if(q("#drop")){$("pf_files").click();return}
 if(x=q("[data-ph]")){const i=+x.dataset.i,a=x.dataset.ph;if(a==="del"){S.post.photos.splice(i,1);renderPhotos()}else if(a==="cover")movePhoto(i,0);else movePhoto(i,a==="left"?i-1:i+1);return}
 if(x=q("[data-ls]")){return busy(x,async()=>{try{await API.listings.setStatus(x.dataset.id,x.dataset.ls);S.mine=await API.listings.mine();render()}catch(err){toast(mapErr(err).message)}})}

 if(q("[data-logout]")){await API.auth.signOut();S.session=null;S.profile=null;S.favs=new Set();S.inq=[];S.post=null;return nav("welcome")}

document.addEventListener("drop",e=>{const z=e.target.closest&&e.target.closest("#drop,.phi");if(!z)return;e.preventDefault();
 if(dragI!==null&&z.classList.contains("phi")){movePhoto(dragI,+z.dataset.pi);dragI=null;return}
 if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length&&S.post){z.classList&&z.classList.remove("over");addFiles(e.dataTransfer.files)}});

window.__boot=async function boot(){
 API.auth.onChange(async(ev,s)=>{
  if(ev==="PASSWORD_RECOVERY"){S.recovering=false;S.session=s;S.route="reset";render();return}
  if(ev==="SIGNED_IN"&&s&&!S.session)await afterLogin(s);
  if(ev==="SIGNED_OUT"&&S.session){S.session=null;S.profile=null;nav("welcome")}
 });

 S.route=seen?"home":"welcome";render();
 let s=null;try{s=await API.auth.session()}catch(e){}
 if(s){if(!S.session)await afterLogin(s)}else nav(seen?"home":"welcome")
};

const nowIso=()=>new Date().toISOString();
const today=()=>new Date().toISOString().slice(0,10);
const addDays=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
const CNIC_RE=/^\d{5}-\d{7}-\d$/;
const fmtCnic=v=>{const d=String(v||"").replace(/\D/g,"").slice(0,13);return d.length===13?d.slice(0,5)+"-"+d.slice(5,12)+"-"+d.slice(12):String(v||"").trim()};
const stageLabel=s=>t("st_"+(s==="completed"?"completed2":s==="cancelled"?"cancelled2":s));
const chkTag=v=>`<span class="tag ${{passed:"ok",na:"ok",failed:"bad"}[v]||"warn"}">${t("chk_"+v)}</span>`;
function openModal(html,wide){closeModal();const d=document.createElement("div");d.className="ov";d.id="xmodal";d.innerHTML=`<div class="modal" role="dialog" aria-modal="true" style="${wide?"width:min(900px,100%)":""}">${html}</div>`;
 d.addEventListener("click",e=>{if(e.target===d)closeModal()});document.body.appendChild(d);const f=d.querySelector("input,button");if(f)f.focus()}
function closeModal(){const m=$("xmodal");if(m)m.remove()}
function al2(id,type,text){const a=$(id);if(!a)return toast(text);a.className="alert "+type;a.textContent=text}
async function copyText(s){try{await navigator.clipboard.writeText(s);toast(t("copied"))}catch(e){toast(s)}}

const DX=LIVE?null:API._x;
if(DX){const D0=DX.D;["deals","docs","comms","svc"].forEach(k=>{if(!D0[k])D0[k]=[]});D0.proofs=D0.proofs||[]}
const BOTS=["demo-owner","demo-buyer"];
const pName=id=>{if(id==="demo-owner")return "Demo Owner";if(id==="demo-buyer")return "Demo Buyer";const u=DX&&DX.D.users.find(x=>x.id===id);return u?u.profile.full_name:""};
const pMail=id=>id==="demo-owner"?"owner@demo.chaabi":id==="demo-buyer"?"buyer@demo.chaabi":((DX.D.users.find(x=>x.id===id)||{}).email||"");
function dealMail(d,ev){const D=DX.D,k="d:"+d.id+":"+ev;if(D.proofs.some(p=>p.k===k))return;D.proofs.push({k,inquiry_id:null,event:ev});const l=D.listings.find(x=>x.id===d.listing_id)||{};
 const body=[`${t("code")}: ${d.code}`,`${t("pf_listing")}: ${l.title||""} (${l.area||""}, ${l.city||""})`,`${t("dealPrice")}: ${money(d.price,d.currency)}`,d.bayana_amount?`${t("bAmount")}: ${money(d.bayana_amount,d.currency)}`:"",d.balance_due_date?`${t("iDue")}: ${d.balance_due_date}`:"",`${t("pf_time")}: ${fmtDate(new Date())}`,t("pf_keep")].filter(Boolean).join("\n");
 [d.seller_id,d.buyer_id].filter(Boolean).forEach(id=>DX.mail(pMail(id),`Chaabi.com · ${t("ev_"+ev)} · ${d.code}`,body))}
function dGet(id){const d=DX.D.deals.find(x=>x.id===id);if(!d)throw new Error("Deal not found");return d}
function dAuth(d){const u=DX.need();if(u.id!==d.seller_id&&u.id!==d.buyer_id&&!u.profile.is_admin)throw new Error("Not allowed");return u}
function dView(d){const D=DX.D;return Object.assign({},d,{listing:D.listings.find(x=>x.id===d.listing_id)||{},seller_pname:pName(d.seller_id),buyer_pname:pName(d.buyer_id),docs:D.docs.filter(x=>x.deal_id===d.id),comms:D.comms.filter(c=>c.deal_id===d.id)})}
function dRefresh(d){if(d.stage!=="completed")return;d.verified=d.doc_check==="passed"&&["passed","na"].includes(d.society_check);const l=DX.D.listings.find(x=>x.id===d.listing_id);if(l)l.verified_deal=d.verified}
function dFinish(d){if(d.stage==="iqrar"&&d.seller_done_at&&d.buyer_done_at){d.stage="completed";const l=DX.D.listings.find(x=>x.id===d.listing_id);if(l)l.status=l.mode==="rent"?"rented":"sold";
  ["seller","buyer"].forEach(p=>DX.D.comms.push({id:"c_"+DX.uid(),deal_id:d.id,user_id:d[p+"_id"],party:p,amount:Math.round(d.price*COMMISSION_RATE),currency:d.currency,status:"due",receipt_no:"CHR-"+DX.uid().toUpperCase(),created_at:nowIso()}));
  dRefresh(d);dealMail(d,"deal_completed");return true}return false}
function dAuto(d){if(!DX)return;setTimeout(()=>{let ch=false;const bot=id=>BOTS.includes(id);
 if(d.stage==="token"&&d.buyer_id&&bot(d.buyer_id)){Object.assign(d,{bayana_amount:Math.round(d.price*.1),bayana_mode:"cash",bayana_paid_at:today(),stage:"bayana"});dealMail(d,"bayana_recorded");ch=true}
 else if(d.stage==="bayana"&&!d.bayana_confirmed_at&&bot(d.seller_id)){d.bayana_confirmed_at=nowIso();dealMail(d,"bayana_confirmed");ch=true}
 else if(d.stage==="bayana"&&d.bayana_confirmed_at){
  for(const p of ["seller","buyer"]){if(bot(d[p+"_id"])&&!d[p+"_name"]){d[p+"_name"]=pName(d[p+"_id"]);d[p+"_father"]="Demo Father";d[p+"_cnic"]="12345-1234567-1";ch=true}}
  if(!ch&&bot(d.seller_id)&&!d.balance_due_date){d.balance_due_date=addDays(30);d.possession_date=addDays(45);d.terms=T.en.defTerms||"";ch=true}
  if(!ch&&d.seller_name&&d.buyer_name&&d.balance_due_date){for(const p of ["seller","buyer"]){if(bot(d[p+"_id"])&&!d[p+"_sign"]&&(d.seller_sign||d.buyer_sign||p==="seller")){d[p+"_sign"]=d[p+"_name"];d[p+"_signed_at"]=nowIso();dealMail(d,p+"_signed");ch=true;break}}}
  if(d.seller_sign&&d.buyer_sign&&d.stage==="bayana"){d.stage="iqrar";ch=true}}
 else if(d.stage==="iqrar"){for(const p of ["seller","buyer"]){if(bot(d[p+"_id"])&&!d[p+"_done_at"]&&(d.seller_done_at||d.buyer_done_at)){d[p+"_done_at"]=nowIso();ch=true}}if(dFinish(d))ch=true}
 if(ch){DX.save();if(S.route==="deal"&&S.arg===d.id)nav("deal",d.id,true);else if(S.route==="deals")nav("deals",null,true);dAuto(d)}},1600)}

 async mine(){const u=DX.need();return DX.D.deals.filter(d=>d.seller_id===u.id||d.buyer_id===u.id).sort(byNew).map(dView)},
 async get(id){const d=dGet(id);dAuth(d);return dView(d)},
 async create(listing,price,inquiry){const u=DX.need();await DX.wait();const l=DX.D.listings.find(x=>x.id===listing);if(!l)throw new Error(t("errGone"));let b=null;
  if(inquiry){const i=DX.D.inq.find(x=>x.id===inquiry);if(!i||!["accepted","completed"].includes(i.status))throw new Error("The request must be accepted first");b=i.sender_id}
  if(u.id!==l.owner_id&&u.id!==b)throw new Error("Only the owner or the accepted buyer can start a deal");
  if(DX.D.deals.some(d=>d.listing_id===listing&&["token","bayana","iqrar"].includes(d.stage)))throw new Error(t("errOpenDeal"));
  const d={id:"dl_"+DX.uid(),code:"CHD-"+DX.uid().toUpperCase().slice(0,6),listing_id:listing,inquiry_id:inquiry||null,seller_id:l.owner_id,buyer_id:b,currency:l.currency||"PKR",price:Math.round(+price||l.price),stage:"token",doc_check:"pending",society_check:"pending",verified:false,created_at:nowIso()};
  DX.D.deals.unshift(d);DX.save();dealMail(d,"deal_created");dAuto(d);return d},
 async join(code){const u=DX.need();await DX.wait();const d=DX.D.deals.find(x=>x.code===String(code).trim().toUpperCase());if(!d)throw new Error("Deal code not found");
  if(d.stage!=="token")throw new Error("This deal is no longer open to join");if(d.seller_id===u.id)throw new Error("You are the seller in this deal");if(d.buyer_id&&d.buyer_id!==u.id)throw new Error("This deal already has a buyer");
  d.buyer_id=u.id;DX.save();dealMail(d,"buyer_joined");dAuto(d);return d},
 async demoBuyer(id){const d=dGet(id);if(d.buyer_id)return d;d.buyer_id="demo-buyer";DX.save();dealMail(d,"buyer_joined");dAuto(d);return d},
 async bayana(id,p){const d=dGet(id),u=dAuth(d);await DX.wait();if(u.id!==d.buyer_id)throw new Error("Only the buyer records the bayana");if(d.stage!=="token")throw new Error("Bayana is already recorded");

/* ---------------- AI expert ---------------- */
const AI_SYS=`You are "Chaabi AI Expert" inside the Chaabi.com property app (Pakistan first, also worldwide). You are an expert in land and plot measurement (marla, kanal, sq ft, sq yd; marla standards differ: 225, 250 or 272.25 sq ft), Pakistani property documents (fard, intiqal, registry, allotment letter, NOC, approved map), housing society approval checks (CDA, RDA, LDA and other authorities), construction (grey structure, finishing, materials, cost per sq ft), house condition (cracks, seepage, damp, roof, wiring, plumbing, drainage) and rent or price estimation from comparable properties.
Rules: 1) Reply in the user's language and script: Roman Urdu gets Roman Urdu, Urdu script gets Urdu script, otherwise English. 2) For photos, first list only what is actually visible, then what cannot be confirmed from a photo. Never invent hidden defects and never claim certainty you do not have. 3) For prices and costs, give a range with the assumptions (area, location, quality, date) and say what local data would narrow it. Never present an estimate as a confirmed value. 4) Never state the legal status of a specific society or document as fact; name the official list or office that confirms it. 5) Use short headings and bullet points. End with the next step, such as a Chaabi.com Ghar Health Check, Document Check or a site measurement when confirmation is needed.`;
const AI={async ask(hist,blobs,onPart){
 if(LIVE&&CONFIG.AI_ENABLED){const images=await Promise.all(blobs.map(async b=>({media_type:b.type,data:(await blobToData(b)).split(",")[1]})));
  const r=await SBX.functions.invoke("ai-agent",{body:{messages:hist,images}});
  if(r.error){let m=t("aiErr");try{const j=await r.error.context.json();if(j&&j.error==="limit")m=t("aiLimit");if(j&&j.error==="off")m=t("aiOff")}catch(e){}throw new Error(m)}return r.data.text}
 if(window.claude&&window.claude.use){const s=await window.claude.use("sample");if(s){
  const msgs=hist.map((m,i)=>({role:m.role,content:i===0?AI_SYS+"\n\n---\n\n"+m.content:m.content}));const opts={onText:x=>onPart&&onPart(x.text)};
  if(blobs.length){try{const lim=await s.limits();if(lim&&lim.images)opts.images=blobs}catch(e){}}
  try{const r=await s(msgs,opts);return r.text}catch(e){if(e&&e.code==="rate_limited")throw new Error(t("aiLimit"));throw new Error(t("aiErr"))}}}
 throw new Error(t("aiOff"))}};

 else body=(S.adReq||[]).length?`<div class="stack">${S.adReq.map(r=>`<div class="box stack" style="gap:6px"><div class="row" style="gap:6px"><b>${esc(t("k_"+r.kind))}</b>${r.plan?`<span class="tag">${esc(t("p_"+r.plan))}</span>`:""}<span class="note">${esc(r.city||"")} · ${esc(fmtDate(r.created_at))}</span><span class="sp"></span>
  <select class="in" data-reqst="${esc(r.id)}" style="width:auto;min-height:38px">${["new","contacted","scheduled","done","cancelled"].map(s=>opt(s,t("rq_"+s),r.status)).join("")}</select></div>${r.details?`<div class="meta" style="white-space:pre-wrap">${esc(r.details)}</div>`:""}${r.preferred_at?`<div class="note">${t("svWhen")}: ${esc(fmtDate(r.preferred_at))}</div>`:""}</div>`).join("")}</div>`:empty;
 return `<div class="page"><h1 class="ph1 disp">${t("adH")}</h1>${tabs}${body}</div>`};

/* ---------------- events ---------------- */
async function afterDeal(d,ev,msg){if(ev)await proofD(d.id,ev);if(msg)toast(msg);await nav("deal",d.id,true)}
document.addEventListener("click",async e=>{const q=s=>e.target.closest(s);let x;
 if(x=q("[data-deal]")){return nav("deal",x.dataset.deal)}
 if(x=q("[data-startdeal]")||q("[data-dealfrom]")){const lid=x.dataset.startdeal||x.dataset.l,inq=x.dataset.dealfrom||null;
  let l=S.cur&&S.cur.id===lid?S.cur:null;if(!l){try{l=await API.listings.get(lid)}catch(err){l={id:lid,price:0,currency:"PKR",mode:"sale"}}}
  S.dealStart={lid,inq};openModal(`<h2 class="disp">${t("startDeal")}</h2><p class="meta" style="margin:0">${esc(l.title||"")}</p><form id="fDealStart" class="stack" novalidate><label class="f" for="ds_price">${l.mode==="rent"?t("dealRent"):t("dealPrice")} (${esc(l.currency||"PKR")})<input class="in" id="ds_price" type="number" min="1" value="${+l.price||""}"></label><div class="alert" id="al_ds" role="alert"></div><div class="row"><button class="btn" type="submit">${t("create2")}</button><button type="button" class="btn ghost" data-closemodal>${t("close")}</button></div></form>`);return}
 if(q("[data-closemodal]")){return closeModal()}
 if(q("[data-print]")){try{window.print()}catch(err){}return}
 if(x=q("[data-copy]")){return copyText(x.dataset.copy)}
 if(x=q("[data-ddoc]")){return showDoc(x.dataset.ddoc)}
 if(x=q("[data-dact]")){const a=x.dataset.dact,id=S.deal.id;const evs={confirmBayana:"bayana_confirmed",cancel:"deal_cancelled",demoBuyer:"buyer_joined"};
  return busy(x,async()=>{try{const d=await DEALS[a](id);let ev=evs[a];if(a==="complete")ev=d&&d.stage==="completed"?"deal_completed":null;await afterDeal(d||{id},ev)}catch(err){toast(mapErr(err).message)}})}
 if(x=q("[data-feature]")){return busy(x,async()=>{try{await SVC.feature(x.dataset.feature);toast(t("featuredOk"))}catch(err){toast(mapErr(err).message)}})}
 if(x=q("[data-svc]")){if(!S.session){S.after={r:"services"};return nav("login")}if(S.route!=="services"){await nav("services");setTimeout(()=>svForm(x.dataset.svc,x.dataset.plan),50);return}return svForm(x.dataset.svc,x.dataset.plan)}
 if(x=q("[data-hc]")){S.hc=S.hc||{};S.hc[x.dataset.hc]=+x.dataset.v;x.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===x));return hcCalc()}
 if(x=q("[data-adtab]")){S.adTab=x.dataset.adtab;return nav("admin",null,true)}
 if(x=q("[data-adsave]")){const id=x.dataset.adsave;return busy(x,async()=>{try{await DEALS.adminCheck(id,{doc:$("ad_doc_"+id).value,docNote:$("ad_dn_"+id).value.trim(),soc:$("ad_soc_"+id).value,socNote:$("ad_sn_"+id).value.trim()});toast(t("savedOk2"));S.adDeals=await DEALS.adminList();render()}catch(err){toast(mapErr(err).message)}})}
 if(x=q("[data-commpaid]")){return busy(x,async()=>{try{await DEALS.markComm(x.dataset.commpaid,"paid");S.adComm=await DEALS.comms();render()}catch(err){toast(mapErr(err).message)}})}
 if(x=q("[data-aiq]")){const i=$("ai_in");if(i){i.value=t("aiQ")[+x.dataset.aiq];i.focus()}return}
 if(q("[data-aiphoto]")){const f=$("ai_files");if(f)f.click();return}
 if(x=q("[data-airm]")){S.aiImgs.splice(+x.dataset.airm,1);const th=$("aithumbs");if(th)th.innerHTML=aiThumbs();return}
 if(q("[data-aimic]")){return toggleMic()}
 if(x=q("[data-say]")){const m=(S.ai||[])[+x.dataset.say];if(m)speak(m.content);return}
 if(q("[data-install]")){if(deferredPrompt){deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(err){}deferredPrompt=null;render()}return}
});
document.addEventListener("submit",async e=>{const f=e.target,btn=f.querySelector("[type=submit]");
 if(f.id==="fJoin"){const c=val("jn_code").toUpperCase();if(!/^CHD-[0-9A-Z]{6}$/.test(c))return al2("al_join","err",t("vNot"));
  return busy(btn,async()=>{try{const d=await DEALS.join(c);await afterDeal(d,"buyer_joined")}catch(err){al2("al_join","err",mapErr(err).message)}})}
 if(f.id==="fDealStart"){const p=+val("ds_price");if(!(p>0))return al2("al_ds","err",t("errPrice"));const st=S.dealStart||{};
  return busy(btn,async()=>{try{const d=await DEALS.create(st.lid,p,st.inq);closeModal();await afterDeal(d,"deal_created",t("dealCreated"))}catch(err){al2("al_ds","err",mapErr(err).message)}})}
 if(f.id==="fBay"){const p={amount:+val("by_amt"),mode:val("by_mode"),paid:val("by_date"),ref:val("by_ref")};if(!(p.amount>0)||p.amount>S.deal.price)return al2("al_bay","err",t("errAmount"));
  return busy(btn,async()=>{try{const d=await DEALS.bayana(S.deal.id,p);await afterDeal(d,"bayana_recorded")}catch(err){al2("al_bay","err",mapErr(err).message)}})}
 if(f.id==="fParty"){const p={name:val("pt_name"),father:val("pt_father"),cnic:fmtCnic(val("pt_cnic"))};if(p.name.length<3||p.father.length<3)return al2("al_pt","err",t("errName"));if(!CNIC_RE.test(p.cnic))return al2("al_pt","err",t("errCnic"));
  return busy(btn,async()=>{try{const d=await DEALS.party(S.deal.id,p);await afterDeal(d,null,t("savedOk2"))}catch(err){al2("al_pt","err",mapErr(err).message)}})}
 if(f.id==="fTerms"){const p={due:val("tm_due"),possession:val("tm_pos"),terms:$("tm_txt").value.trim()};if(!p.due)return al2("al_tm","err",t("errStep"));
  return busy(btn,async()=>{try{const d=await DEALS.terms(S.deal.id,p);await afterDeal(d,null,t("savedOk2"))}catch(err){al2("al_tm","err",mapErr(err).message)}})}
 if(f.id==="fSign"){const s=val("sg_name"),d0=S.deal,side=S.session.user.id===d0.seller_id?"seller":"buyer";if(!d0.seller_name||!d0.buyer_name||!d0.balance_due_date)return al2("al_sg","err",t("errNeedAll"));
  if(s.toLowerCase()!==String(d0[side+"_name"]||"").trim().toLowerCase())return al2("al_sg","err",t("errSign"));
  return busy(btn,async()=>{try{const d=await DEALS.sign(d0.id,s);await afterDeal(d,side+"_signed")}catch(err){al2("al_sg","err",mapErr(err).message)}})}
 if(f.id==="fDoc"){const file=$("dc_file").files[0];if(!file||!/^(image\/(jpeg|png|webp)|application\/pdf)$/.test(file.type)||file.size>10*1024*1024)return al2("al_dc","err",t("docType"));
  return busy(btn,async()=>{try{await DEALS.upload(S.deal.id,val("dc_kind"),file);await afterDeal(S.deal,null,t("docOk"))}catch(err){al2("al_dc","err",mapErr(err).message)}})}
 if(f.id==="fVerify"){const c=val("vf_code").toUpperCase(),out=$("vf_out");return busy(btn,async()=>{let r=null;try{r=await DEALS.verify(c)}catch(err){}
  out.innerHTML=r?`<div class="box stack"><div class="row"><span class="tag ok">✓ ${t("vFound")}</span><span class="tag brand">${esc(r.code)}</span></div><div class="ttl">${esc(r.listing_title||"")}</div><div class="meta">${esc([r.city,r.country].filter(Boolean).join(", "))} · ${t("started")} ${esc(fmtDate(r.started_at))}</div>
   <table class="kv"><tr><td>${t("bReceipt")}</td><td>${r.bayana_confirmed?"✓":"—"}</td></tr><tr><td>${t("iH")}</td><td>${r.iqrar_signed?"✓":"—"}</td></tr><tr><td>${t("cH")}</td><td>${r.completed?"✓":esc(stageLabel(r.stage))}</td></tr><tr><td>${t("chkDoc")}</td><td>${t("chk_"+r.doc_check)}</td></tr><tr><td>${t("chkSoc")}</td><td>${t("chk_"+r.society_check)}</td></tr><tr class="tot"><td>${t("vdeal")}</td><td>${r.verified?"✓":"—"}</td></tr></table></div>`:`<div class="alert err">${t("vNot")}</div>`})}
 if(f.id==="fSvc"){const row={kind:val("sv_kind"),plan:val("sv_plan")||null,city:val("sv_city")||null,details:val("sv_det")||null,preferred_at:val("sv_when")?new Date(val("sv_when")).toISOString():null};
  if(!row.details&&!row.plan)return al2("al_sv","err",t("errStep"));
  return busy(btn,async()=>{try{await SVC.create(row);$("svform").innerHTML=`<div class="alert ok" style="margin-top:20px">${t("svOk")}</div>`;S.svMine=await SVC.mine()}catch(err){al2("al_sv","err",mapErr(err).message)}})}
 if(f.id==="fAI"){const v=$("ai_in").value.trim();return aiSend(v)}
});
document.addEventListener("change",async e=>{const el=e.target;
 if(el.id==="pl_shape"){$("pl_r").hidden=el.value!=="rect";$("pl_4").hidden=el.value==="rect";return plotCalc()}
 if(el.id==="pl_marla")return plotCalc();
 if(el.id==="cn_q"){$("cn_fin").value=FIN[el.value];return consCalc()}
 if(el.dataset&&el.dataset.reqst){try{await SVC.setStatus(el.dataset.reqst,el.value);toast(t("savedOk2"))}catch(err){toast(mapErr(err).message)}return}
 if(el.id==="ai_files"){const files=[...el.files].slice(0,4-(S.aiImgs||[]).length);S.aiImgs=S.aiImgs||[];for(const f of files){try{const c=await compress(f);S.aiImgs.push({blob:c.blob,url:c.url})}catch(err){toast(err.message)}}el.value="";const th=$("aithumbs");if(th)th.innerHTML=aiThumbs();return}
});
document.addEventListener("input",e=>{const id=e.target.id||"";if(id.startsWith("pl_"))plotCalc();if(id.startsWith("cn_"))consCalc();if(id==="pt_cnic"){const v=fmtCnic(e.target.value);if(v!==e.target.value&&/^\d{5}-\d{7}-\d$/.test(v))e.target.value=v}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&e.target.id==="ai_in"){e.preventDefault();aiSend(e.target.value.trim())}if(e.key==="Escape"&&$("xmodal"))closeModal()});

/* ---------------- installable app ---------------- */
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;const b=$("installBtn");if(b)b.hidden=false});
window.addEventListener("appinstalled",()=>{deferredPrompt=null;toast(t("installed"))});
if("serviceWorker" in navigator&&location.protocol==="https:"&&!window.claude){navigator.serviceWorker.register("sw.js").catch(()=>{})}
const _render0=render;
render=function(){_render0();const b=$("installBtn");if(b)b.hidden=!deferredPrompt;if(S.route==="services"){plotCalc();consCalc();hcCalc()}};
window.__boot();

</script>
